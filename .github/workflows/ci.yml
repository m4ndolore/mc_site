name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            cloudflare/api-worker/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install API worker dependencies
        run: npm ci --prefix cloudflare/api-worker

      - name: Lint
        run: npm run lint

      - name: Secret scan
        run: npm run secrets:scan

      - name: Build
        env:
          MC_REQUIRE_LIVE_SEED: '1'
        run: npm run build

      # After the build, so it checks the feed that was just seeded live rather
      # than the snapshot committed in the repo. Every /companies/{slug} URL is
      # named by toSlug(company.name); if upstream changes how a company is
      # spelled, the page regenerates under a new name, the old file lingers and
      # keeps serving stale content, and nothing else in this build notices.
      - name: Verify company page slugs
        run: npm run verify:slugs

      - name: Enforce performance budgets
        run: npm run check:performance

      - name: Router unit tests
        run: node cloudflare/test-router.mjs --unit

      - name: API worker typecheck
        run: npm run typecheck --prefix cloudflare/api-worker

      - name: API worker unit tests
        run: npm run test --prefix cloudflare/api-worker

      # Visual Regression Tests
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run visual regression tests
        run: npx playwright test

      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/visual/playwright-report/
          retention-days: 14

      - name: Upload screenshot diffs
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-diffs
          path: tests/visual/test-results/
          retention-days: 14

      # Deployment is owned by the Cloudflare Pages Git integration, which builds
      # and deploys mc-site directly on push. This workflow verifies only.
